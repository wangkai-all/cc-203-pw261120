<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>枪口可用性分析</title>
  <meta name="description" content="充电站枪口可用时段还原与利用率分析：多源记录、双口径利用率、冲突与迟到消息对比。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M10 22V12l6-4 6 4v10' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="topbar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="var(--brand-fill)"/>
        <path d="M10 23V12l6-4 6 4v11" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 23v-4h6v4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>枪口可用性分析</h1>
        <p class="brand-sub">状态流 · 订单 · 维修记录 → 可服务 / 占用 / 故障 / 离线 / 未确认</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="site-clock" id="site-clock" title="站点时区"></span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深色模式" title="切换深浅色">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8Z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="filterbar" role="region" aria-label="分析范围">
    <label class="field">
      <span>站点</span>
      <select id="site-select" aria-label="切换站点"></select>
    </label>
    <div class="field">
      <span id="range-label">分析窗口</span>
      <div class="segmented" role="group" aria-labelledby="range-label" id="range-presets">
        <button type="button" data-days="1">1 天</button>
        <button type="button" data-days="3" aria-pressed="true">3 天</button>
        <button type="button" data-days="7">7 天</button>
      </div>
    </div>
    <label class="field">
      <span>版本</span>
      <select id="version-select" aria-label="选择分析版本"></select>
    </label>
    <div class="field field-actions">
      <span class="sr-only">操作</span>
      <button class="btn" id="recompute-btn" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        重算并生成版本
      </button>
      <button class="btn btn-ghost" id="export-csv" type="button">导出明细 CSV</button>
      <button class="btn btn-ghost" id="export-json" type="button">导出 JSON</button>
    </div>
    <p class="window-note" id="window-note"></p>
  </div>

  <nav class="tabs" aria-label="视图">
    <button type="button" role="tab" data-view="overview" aria-selected="true">概览</button>
    <button type="button" role="tab" data-view="timeline">单枪时间线</button>
    <button type="button" role="tab" data-view="conflicts">冲突与未确认</button>
    <button type="button" role="tab" data-view="inbox">迟到消息</button>
    <button type="button" role="tab" data-view="versions">版本与对比</button>
    <button type="button" role="tab" data-view="records">原始记录</button>
  </nav>

  <main id="main" class="main">
    <div id="loading" class="loading" role="status">正在加载分析…</div>
    <div id="view-root" hidden></div>
  </main>

  <aside id="detail-drawer" class="drawer" hidden aria-label="明细">
    <div class="drawer-head">
      <h2 id="drawer-title">明细</h2>
      <button class="icon-btn" id="drawer-close" type="button" aria-label="关闭明细">✕</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <footer class="footer">
    <p>样例数据完全虚构。分析引擎 <span id="engine-version">—</span>；重算生成不可变版本，可回看与导出。</p>
    <p><a href="#" id="about-link">口径与假设</a></p>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
